<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Office</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Office">
  <meta name="theme-color" content="#7a2e22">
  <link rel="icon" href="assets/jerusalem-cross.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/jerusalem-cross.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,500;1,500&family=Karla:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-office="morning">
  <header class="top">
    <div class="brand">
      <img src="assets/jerusalem-cross.svg" alt="">
      <div>
        <h1>The Daily Office</h1>
        <small id="season-label">Trinity Season</small>
      </div>
    </div>
    <div class="meta-row">
      <span id="date-label"></span>
      <span class="clock" id="clock"></span>
    </div>
    <div class="tabs">
      <button type="button" data-office="morning">Morning</button>
      <button type="button" data-office="noon">Midday</button>
      <button type="button" data-office="evening">Evening</button>
    </div>
    <div class="date-nav">
      <button type="button" id="prev">Previous</button>
      <button type="button" id="today">Today</button>
      <button type="button" id="next">Next</button>
    </div>
  </header>
  <main id="view"></main>
  <script src="js/bible.js"></script>
  <script src="js/chapters.js"></script>
  <script src="js/catechism.js"></script>
  <script src="js/liturgy.js"></script>
  <script src="js/office.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
